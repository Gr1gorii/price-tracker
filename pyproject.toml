[project]
name = "bfp"
version = "0.1.0"
description = "Black Friday 2026 price tracker: collector + art. 17-bis compliance checker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "extruct>=0.17",
    "lxml>=5",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
render = ["playwright>=1.47"]

[project.scripts]
bfp = "bfp.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bfp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
